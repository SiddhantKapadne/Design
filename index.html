<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Portfolio – Coming Soon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='%23FF8D28'/%3E%3C/svg%3E"
  />
  <style>
    :root {
      color-scheme: light;
      --bg: #f2f2f2;
      --text: #99a1af;
      --muted: #4a5565;
      --accent: #111827;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   system-ui, -system-ui, "Segoe UI", sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: 100%;
      max-width: 720px;
      padding: 16px 32px;
      display: grid;
      grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.1fr);
      grid-template-rows: auto auto;
      grid-template-areas:
        "meta meta"
        "title cta";
      column-gap: 56px;
      row-gap: 32px;
      align-items: center;
      text-align: left;
    }

    .shell > * {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 700ms ease-out forwards;
    }

    .shell > *:nth-child(1) {
      animation-delay: 80ms;
    }

    .shell > *:nth-child(2) {
      animation-delay: 180ms;
    }

    .shell > *:nth-child(3) {
      animation-delay: 260ms;
    }

    .meta-row {
      grid-area: meta;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid rgba(84, 84, 86, 0.18);
      padding-bottom: 12px;
      color: #545456;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #545456;
    }

    .meta-note {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #545456;
      white-space: nowrap;
      cursor: default;
    }

    .meta-note-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background-color: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.16);
    }

    .meta-note-text {
      opacity: 0.9;
    }

    .meta-note-tooltip {
      position: absolute;
      right: 0;
      top: 150%;
      transform: translateY(6px);
      padding: 6px 10px;
      border-radius: 999px;
      background: #112714;
      color: #f9fafb;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .meta-note:hover .meta-note-tooltip {
      opacity: 1;
      transform: translateY(0);
    }

    .main-block {
      grid-area: title;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 420px;
    }

    h2 {
      font-size: clamp(24px, 2.2vw, 24px);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #99a1af;
      line-height: 1.5;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 400px;
    }

    .cta-block {
      grid-area: cta;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0;
      padding-top: 6px;
    }

    .cta-label {
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .primary-cta {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      background: #FF8D28;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background-color 160ms ease, opacity 160ms ease, transform 4000ms ease;
    }

    .primary-cta::before {
      content: none;
    }

    .primary-cta:hover {
      background-color: #fb8116;
      transform: translateY(-1px);
    }

    .primary-cta:hover::before {
      transform: translateX(120%);
    }

    .primary-cta:active {
      opacity: 0.95;
      transform: translateY(0);
    }

    .primary-cta-label {
      position: relative;
      z-index: 1;
    }

    .primary-cta-icon {
      position: relative;
      z-index: 1;
      font-size: 14px;
      transform: translateX(0);
      transition: transform 160ms ease;
    }

    .primary-cta:hover .primary-cta-icon {
      transform: translateX(3px);
    }

    .cta-caption {
      font-size: 12px;
      color: var(--muted);
    }

    .dot-pattern {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
      background-image: radial-gradient(circle, rgba(255, 139, 38) 0, rgba(255, 141, 40) 2.3px, transparent 2px);
      background-size: 12px 12px;
      mask-image: linear-gradient(to top, black 0%, black 40%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, black 0%, black 40%, transparent 100%);
      animation: dotRise 14s linear infinite;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dotRise {
      0% {
        background-position: 0 0;
        opacity: 0.6;
      }
      50% {
        background-position: 0 -40px;
        opacity: 0.9;
      }
      100% {
        background-position: 0 -120px;
        opacity: 0.6;
      }
    }

    @media (max-width: 768px) {
      .shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "meta"
          "title"
          "cta";
        row-gap: 24px;
        padding: 16px 20px;
      }

      .meta-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
    }

    @media (max-width: 480px) {
      .shell {
        padding: 16px 16px 20px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main class="shell" role="main" aria-label="Portfolio coming soon">
    <header class="meta-row">
      <div class="eyebrow">Portfolio 2026</div>
      <div class="meta-note">
        <span class="meta-note-dot" aria-hidden="true"></span>
        <span class="meta-note-tooltip" role="status">Open to work</span>
      </div>
    </header>

    <section class="main-block" aria-label="Coming soon message">
      <p class="subtitle">
        Siddhant is a designer driven by storytelling and visual form with a passion for creating meaningful experiences.
      </p>
      <h2>New Portfolio Coming soon</h2>
    </section>

    <section class="cta-block" aria-label="2025 portfolio access">
      <!-- Replace the href with your actual 2025 portfolio link -->
      <a class="primary-cta" href="https://siddhantkapadne.github.io/oldfolio" target="_blank" rel="noopener noreferrer">
        <span class="primary-cta-label">view 2025 portfolio</span>
        <span class="primary-cta-icon">↗</span>
      </a>
    </section>
  </main>
  <div class="dot-pattern" aria-hidden="true"></div>
</body>
</html>
